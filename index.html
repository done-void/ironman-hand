<!DOCTYPE html>

<title>Holo Hand — アイアンマン風ホログラム</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Hiragino Sans", sans-serif; }

  #hud2d, #gl { pointer-events: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;

  }
  #info {
    position: fixed; left: 16px; bottom: 16px; color: #7fdfff; z-index: 10;

    background: rgba(0, 20, 40, .35); border: 1px solid rgba(0,200,255,.35);
    border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(4px);

    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);

  body.ui-closed #modelbar { opacity: 0; transform: translate(-50%, 90px); pointer-events: none; }
  #ui-toggle {
    position: fixed; right: 16px; bottom: 14px; z-index: 21;
  }
  #modelbar button, #ui-toggle {

    backdrop-filter: blur(4px); cursor: pointer; touch-action: manipulation;
    text-shadow: 0 0 8px rgba(0,200,255,.8); transition: background .15s, box-shadow .15s;
  }

<body>
<video id="video" autoplay playsinline muted></video>
<div id="vignette"></div>
<canvas id="hud2d"></canvas>
<canvas id="gl"></canvas>
<div id="status">SYSTEM BOOTING…</div>
<div id="info">
  ✋ 手のひらをかざす → オブジェクト出現 / 手を前後に動かす → 近づく・遠ざかる<br>
  🤏 つまむ → 掴んで移動 / 素早く振って離す → 投げる（壁で跳ね返る）<br>

  <b>1</b>:キューブ <b>2</b>:球体 <b>3</b>:リアクター <b>4</b>:太陽系 <b>5</b>:銀河 <b>6</b>:はなはな（<b>M</b>:切替）/ <b>H</b>:スケルトン / <b>U</b>:UI開閉 / 🔊 クリックでサウンドON

<script type="importmap">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"

<script type="module">
import * as THREE from "three";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const hud = document.getElementById("hud2d");
const hudCtx = hud.getContext("2d");
const statusEl = document.getElementById("status");

const HOLO = new THREE.Color(0x33ccff);
const HOLO_BRIGHT = new THREE.Color(0xaaf0ff);
const THROW_SPEED = 1.3;   // これ以上の速さでピンチを離すと投げる(ワールド単位/秒)
const MAX_SPEED = 6;

let toastTimer;
function toast(msg, ms = 2500) {
  statusEl.textContent = msg;
  statusEl.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (statusEl.style.opacity = "0"), ms);
}

// ---------- サウンド(Web Audioで全部合成・外部ファイルなし) ----------
class SFX {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.enabled ? 0.5 : 0;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.startAmbient();
  }
  // 環境音: 低いドローン + 高域の淡いきらめき(どちらもゆっくり揺らぐ)
  startAmbient() {
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + 5);
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 240;
    lp.connect(g); g.connect(this.master);
    for (const [freq, type, det] of [[55, "sine", 0], [55, "sine", 7], [110, "triangle", -4]]) {
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = freq; o.detune.value = det;
      o.connect(lp); o.start();
    }
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = 0.07; lfoG.gain.value = 0.02;
    lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
    const shimmer = ctx.createBufferSource();
    shimmer.buffer = this.noiseBuf; shimmer.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 20;
    const sg = ctx.createGain(); sg.gain.value = 0.006;
    shimmer.connect(bp); bp.connect(sg); sg.connect(this.master);
    const lfo2 = ctx.createOscillator(), lfo2G = ctx.createGain();
    lfo2.frequency.value = 0.045; lfo2G.gain.value = 0.005;
    lfo2.connect(lfo2G); lfo2G.connect(sg.gain); lfo2.start();
    shimmer.start();
  }
  blip(f0, f1, dur, vol, type = "sine", delay = 0) {
    if (!this.ctx || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  whoosh(f0, f1, dur, vol) {
    if (!this.ctx || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.05);
  }
  appear() { this.whoosh(300, 2400, 0.45, 0.1); this.blip(180, 740, 0.4, 0.07); }
  grab() { this.blip(480, 940, 0.1, 0.16, "triangle"); }
  release(speed) { this.whoosh(1800, 260, 0.32, THREE.MathUtils.clamp(0.05 + speed * 0.04, 0.08, 0.2)); }
  bounce(impact) {
    if (!this.ctx) return;
    if (this.ctx.currentTime - (this._lastBounce ?? 0) < 0.08) return;
    this._lastBounce = this.ctx.currentTime;
    this.blip(240, 85, 0.13, THREE.MathUtils.clamp(impact * 0.06, 0.04, 0.18));
  }
  catchChime() { this.blip(660, 660, 0.3, 0.1); this.blip(990, 990, 0.35, 0.08, "sine", 0.07); }
  uiSwitch() { this.blip(840, 1280, 0.07, 0.09, "triangle"); }
  toggle() {
    if (!this.ctx) { this.init(); return this.enabled; }  // 初回タップはONで開始
    this.enabled = !this.enabled;
    this.master.gain.value = this.enabled ? 0.5 : 0;
    return this.enabled;
  }
}
const sfx = new SFX();
// AudioContextはユーザー操作がないと開始できないので最初の操作で起動
// (サウンドボタン自身はtoggle()側で起動するため除外)
const bootAudio = e => {
  if (e.target && e.target.id === "btn-sound") return;
  sfx.init();
  removeEventListener("pointerdown", bootAudio);
  removeEventListener("keydown", bootAudio);
};
addEventListener("pointerdown", bootAudio);
addEventListener("keydown", bootAudio);

// ---------- Three.js セットアップ ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
camera.position.set(0, 0, 2);
scene.add(new THREE.AmbientLight(0x88ccff, 0.6));

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  hud.width = innerWidth * devicePixelRatio;
  hud.height = innerHeight * devicePixelRatio;
  hudCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener("resize", resize);
resize();

// 画面上のz=0平面における1pxあたりのワールド長
function worldPerPixel() {
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  return h / innerHeight;
}
// スクリーン座標(px) → 指定z平面のワールド座標
function screenToWorld(sx, sy, targetZ = 0) {
  const ndc = new THREE.Vector3((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1, 0.5);
  ndc.unproject(camera);
  const dir = ndc.sub(camera.position).normalize();
  const t = (targetZ - camera.position.z) / dir.z;
  return camera.position.clone().add(dir.multiplyScalar(t));
}

// ---------- グロー用スプライトテクスチャ ----------
function makeGlowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(170,240,255,1)");
  grad.addColorStop(0.25, "rgba(60,200,255,0.55)");
  grad.addColorStop(1, "rgba(0,120,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// ---------- 5種のホログラム形状 ----------
const SHAPE_NAMES = ["CUBE", "SPHERE", "ARC REACTOR", "SOLAR SYSTEM", "GALAXY", "HANA-HANA"];

function buildShapes(mats) {
  const reg = (m, base) => { m.userData.baseOpacity = base; mats.push(m); return m; };
  const mesh = (geo, base, color = HOLO) => new THREE.Mesh(geo, reg(new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: base,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  }), base));
  const edges = (geo, base, color = HOLO_BRIGHT) => new THREE.LineSegments(new THREE.EdgesGeometry(geo), reg(new THREE.LineBasicMaterial({
    color, transparent: true, opacity: base,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }), base));

  const shapes = [];

  // 1) キューブ
  {
    const grp = new THREE.Group();
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const box = mesh(boxGeo, 0.18);
    const edge = edges(boxGeo, 0.9);
    const core = mesh(new THREE.OctahedronGeometry(0.22), 0.85, HOLO_BRIGHT);
    grp.add(box, edge, core);
    shapes.push({ name: "CUBE", grp, spin(dt, rate) {
      box.rotation.y += dt * rate;
      box.rotation.x += dt * rate * 0.55;
      edge.rotation.copy(box.rotation);
      core.rotation.y -= dt * rate * 1.5;
    }});
  }

  // 2) 球体
  {
    const grp = new THREE.Group();
    const icoGeo = new THREE.IcosahedronGeometry(0.55, 1);
    const ico = mesh(icoGeo, 0.1);
    const wire = edges(icoGeo, 0.7);
    const core = mesh(new THREE.SphereGeometry(0.18, 16, 12), 0.85, HOLO_BRIGHT);
    const equator = mesh(new THREE.TorusGeometry(0.66, 0.012, 6, 48), 0.55);
    equator.rotation.x = Math.PI / 2;
    grp.add(ico, wire, core, equator);
    shapes.push({ name: "SPHERE", grp, spin(dt, rate) {
      ico.rotation.y += dt * rate * 0.7;
      ico.rotation.x += dt * rate * 0.2;
      wire.rotation.copy(ico.rotation);
      equator.rotation.z += dt * rate * 0.9;
      core.rotation.y -= dt * rate;
    }});
  }

  // 3) アークリアクター
  {
    const grp = new THREE.Group();
    const outer = mesh(new THREE.TorusGeometry(0.5, 0.04, 8, 48), 0.85, HOLO_BRIGHT);
    const inner = mesh(new THREE.TorusGeometry(0.26, 0.025, 8, 40), 0.8, HOLO_BRIGHT);
    const core = mesh(new THREE.SphereGeometry(0.12, 16, 12), 0.95, HOLO_BRIGHT);
    const coils = new THREE.Group();
    const coilGeo = new THREE.BoxGeometry(0.07, 0.16, 0.05);
    const coilMat = reg(new THREE.MeshBasicMaterial({
      color: HOLO, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }), 0.55);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      const c = new THREE.Mesh(coilGeo, coilMat);
      c.position.set(Math.cos(a) * 0.38, Math.sin(a) * 0.38, 0);
      c.rotation.z = a + Math.PI / 2;
      coils.add(c);
    }
    const orbiters = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      const o = mesh(new THREE.SphereGeometry(0.03, 8, 6), 0.9, HOLO_BRIGHT);
      o.position.set(Math.cos(a) * 0.19, Math.sin(a) * 0.19, 0);
      orbiters.add(o);
    }
    grp.add(outer, inner, core, coils, orbiters);
    grp.rotation.x = 0.18;
    shapes.push({ name: "ARC REACTOR", grp, spin(dt, rate) {
      coils.rotation.z += dt * rate * 0.4;
      orbiters.rotation.z -= dt * rate * 1.5;
    }});
  }

  // 4) 太陽系（惑星が公転するミニチュア）
  {
    const grp = new THREE.Group();
    const sun = mesh(new THREE.SphereGeometry(0.11, 16, 12), 0.95, 0xffcc66);
    // [軌道半径, 惑星サイズ, 公転速度, 色, 環あり]
    const defs = [
      [0.18, 0.022, 2.6, 0x9fb6c9],        // 水星
      [0.25, 0.032, 2.0, 0xffd9a0],        // 金星
      [0.33, 0.034, 1.6, 0x66aaff],        // 地球
      [0.40, 0.027, 1.3, 0xff8866],        // 火星
      [0.49, 0.052, 0.9, 0xffcc99],        // 木星
      [0.58, 0.045, 0.7, 0xeedd99, true],  // 土星
    ];
    const planets = [];
    for (const [r, size, speed, color, hasRing] of defs) {
      const pivot = new THREE.Group();
      const p = mesh(new THREE.SphereGeometry(size, 10, 8), 0.9, color);
      p.position.x = r;
      pivot.add(p);
      if (hasRing) {
        const rg = mesh(new THREE.TorusGeometry(size * 1.9, size * 0.28, 2, 24), 0.6, 0xddcc88);
        rg.rotation.x = Math.PI / 2 - 0.4;
        p.add(rg);
      }
      pivot.rotation.z = Math.random() * Math.PI * 2;
      const circGeo = new THREE.BufferGeometry().setFromPoints(
        Array.from({ length: 64 }, (_, i) => {
          const a = (i / 64) * Math.PI * 2;
          return new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0);
        })
      );
      const circ = new THREE.LineLoop(circGeo, reg(new THREE.LineBasicMaterial({
        color: HOLO, transparent: true, opacity: 0.22,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }), 0.22));
      grp.add(pivot, circ);
      planets.push({ pivot, speed });
    }
    grp.add(sun);
    grp.rotation.x = -0.9;   // 斜め上から見下ろす角度
    shapes.push({ name: "SOLAR SYSTEM", grp, glowColor: 0xffd9a0, glowScale: 1.5, spin(dt, rate) {
      for (const pl of planets) pl.pivot.rotation.z += dt * rate * pl.speed * 0.8;
      sun.rotation.y += dt * rate * 0.3;
    }});
  }

  // 5) 渦巻銀河(シェーダーパーティクル: 差動回転 + 星ごとの瞬き + 掴むとバースト)
  {
    const grp = new THREE.Group();
    const N = 4500;
    // positionに (半径, 初期角, 面からの高さ) を詰めて、xyはシェーダーで毎フレーム計算する
    const pos = new Float32Array(N * 3);
    const colA = new Float32Array(N * 3);
    const sizeA = new Float32Array(N), phaseA = new Float32Array(N), randA = new Float32Array(N);
    const cCore = new THREE.Color(0xfff2cc);
    const cArms = [new THREE.Color(0x66aaff), new THREE.Color(0xcc88ff), new THREE.Color(0x88ddff)];
    for (let i = 0; i < N; i++) {
      const bulge = i < N * 0.22;   // 中心バルジ
      let r, a, zs;
      if (bulge) {
        r = Math.pow(Math.random(), 2) * 0.16;
        a = Math.random() * Math.PI * 2;
        zs = 0.055 * (1 - r / 0.16) + 0.015;
      } else {
        const f = Math.pow(Math.random(), 0.6);
        r = 0.08 + f * 0.5;
        a = f * 4.6 + (i % 3) * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.45;
        zs = 0.04 * (1.25 - f);
      }
      pos[i * 3] = r;
      pos[i * 3 + 1] = a;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 2 * zs;
      const c = cCore.clone().lerp(cArms[i % 3], THREE.MathUtils.clamp((r - 0.05) / 0.5, 0, 1));
      if (!bulge && Math.random() < 0.04) c.set(0xeaf6ff).multiplyScalar(1.25);  // たまに青白い巨星
      colA[i * 3] = c.r; colA[i * 3 + 1] = c.g; colA[i * 3 + 2] = c.b;
      sizeA[i] = bulge ? 1.5 + Math.random() * 2 : 0.8 + Math.pow(Math.random(), 3) * 4.2;
      phaseA[i] = Math.random() * Math.PI * 2;
      randA[i] = Math.random();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("aColor", new THREE.BufferAttribute(colA, 3));
    geo.setAttribute("aSize", new THREE.BufferAttribute(sizeA, 1));
    geo.setAttribute("aPhase", new THREE.BufferAttribute(phaseA, 1));
    geo.setAttribute("aRand", new THREE.BufferAttribute(randA, 1));
    const galMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uBurst: { value: 0 },
        uOpacity: { value: 0.95 },
        uScale: { value: 540 },
      },
      vertexShader: `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aPhase;
        attribute float aRand;
        uniform float uTime;
        uniform float uBurst;
        uniform float uScale;
        varying vec3 vColor;
        varying float vTw;
        void main() {
          float r = position.x;
          float ang = position.y + uTime * (0.5 / (r + 0.15));      // 差動回転: 中心ほど速い
          float rr = r * (1.0 + uBurst * (0.45 + aRand * 0.9));     // バーストで放射状に膨張
          vec3 p = vec3(cos(ang) * rr, sin(ang) * rr, position.z * (1.0 + uBurst * 2.5));
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          vTw = 0.7 + 0.3 * sin(uTime * (2.5 + aRand * 4.0) + aPhase);
          vColor = aColor;
          float sc = length(modelViewMatrix[0].xyz);                // オブジェクトのスケールに追従
          gl_PointSize = max(aSize * vTw * sc * uScale * 0.03 / -mv.z, 1.5);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform float uOpacity;
        varying vec3 vColor;
        varying float vTw;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float a = pow(smoothstep(0.5, 0.0, d), 1.6);
          gl_FragColor = vec4(vColor * (0.75 + 0.5 * vTw), a * uOpacity);
        }
      `,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    galMat.userData.baseOpacity = 0.95;
    // applyOpacity()がm.opacityに書くので、uniformへ橋渡しする
    Object.defineProperty(galMat, "opacity", {
      get() { return this.uniforms.uOpacity.value; },
      set(v) { this.uniforms.uOpacity.value = v; },
    });
    mats.push(galMat);
    const pts = new THREE.Points(geo, galMat);
    pts.frustumCulled = false;   // positionが(r,θ,z)なのでバウンディング計算が当てにならない
    const core = mesh(new THREE.SphereGeometry(0.06, 12, 8), 0.95, 0xfff2cc);
    const coreGlow = new THREE.Sprite(reg(new THREE.SpriteMaterial({
      map: glowTex, color: 0xffe9b0, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }), 0.5));
    coreGlow.scale.setScalar(0.5);
    grp.add(pts, core, coreGlow);
    grp.rotation.x = -0.85;
    shapes.push({
      name: "GALAXY", grp, glowColor: 0xbfaaff, glowScale: 2.4,
      spin(dt, rate) {
        galMat.uniforms.uTime.value += dt * rate * 0.55;
        galMat.uniforms.uBurst.value = Math.max(0, galMat.uniforms.uBurst.value - dt * 1.8);
        galMat.uniforms.uScale.value = renderer.domElement.height * 0.5;
        core.rotation.y += dt * rate * 0.3;
      },
      onGrab() { galMat.uniforms.uBurst.value = 1; },   // 星が散って再収束
    });
  }

  // 6) はなはな(すすきのネオン風 — ピンクの花 + 舞う花びら + ネオンサイン)
  {
    const grp = new THREE.Group();
    const NEON_PINK = 0xff5fae, NEON_LIGHT = 0xffa6d5;

    // 花本体: 楕円花びら2層 + コア(ピボットで放射状に配置)
    const bloom = new THREE.Group();          // 花と花びらだけ傾ける(サインは正面のまま)
    const flower = new THREE.Group();
    const petalGeo = new THREE.SphereGeometry(0.16, 10, 8);
    petalGeo.scale(1, 0.42, 0.14);
    const petalLayers = [
      { n: 6, r: 0.21, tilt: 0.5, color: NEON_PINK, op: 0.7, off: 0 },
      { n: 6, r: 0.12, tilt: 0.95, color: NEON_LIGHT, op: 0.85, off: Math.PI / 6 },
    ];
    for (const { n, r, tilt, color, op, off } of petalLayers) {
      for (let i = 0; i < n; i++) {
        const pivot = new THREE.Group();
        pivot.rotation.y = (i / n) * Math.PI * 2 + off;
        const p = mesh(petalGeo, op, color);
        p.position.x = r;
        p.rotation.z = tilt;
        pivot.add(p);
        flower.add(pivot);
      }
    }
    const flowerCore = mesh(new THREE.SphereGeometry(0.085, 14, 10), 0.95, 0xffe066);
    flower.add(flowerCore);

    // 舞う花びら(2つの粒子クラウドを逆回転させる)
    const mkPetalCloud = (n, size, color) => {
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, r = 0.28 + Math.random() * 0.34;
        pos[i * 3] = Math.cos(a) * r;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
        pos[i * 3 + 2] = Math.sin(a) * r;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(g, reg(new THREE.PointsMaterial({
        color, size, transparent: true, opacity: 0.8,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
      }), 0.8));
    };
    const petalCloudA = mkPetalCloud(90, 0.035, 0xff9ed0);
    const petalCloudB = mkPetalCloud(70, 0.05, NEON_PINK);

    // ネオンサイン「はなはな」
    const signCanvas = document.createElement("canvas");
    signCanvas.width = 512; signCanvas.height = 160;
    const sg = signCanvas.getContext("2d");
    sg.strokeStyle = "rgba(255,95,174,0.95)";
    sg.lineWidth = 6;
    sg.shadowColor = "#ff2d88"; sg.shadowBlur = 24;
    sg.beginPath(); sg.roundRect(10, 10, 492, 140, 28); sg.stroke();
    sg.font = "bold 84px 'Hiragino Sans', sans-serif";
    sg.textAlign = "center"; sg.textBaseline = "middle";
    sg.shadowBlur = 30;
    sg.fillStyle = "#ffd9ec";
    sg.fillText("はなはな", 256, 86);
    const signMat = reg(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(signCanvas), transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }), 0.9);
    const sign = new THREE.Sprite(signMat);
    sign.scale.set(0.66, 0.2, 1);
    sign.position.y = 0.52;

    bloom.add(flower, petalCloudA, petalCloudB);
    bloom.rotation.x = -1.05;   // 花の正面を視点側へ
    grp.add(bloom, sign);

    let hanaBurst = 0, hanaT = 0;
    shapes.push({
      name: "HANA-HANA", grp, glowColor: 0xff7fc4, glowScale: 2.2,
      spin(dt, rate) {
        hanaT += dt;
        hanaBurst = Math.max(0, hanaBurst - dt * 1.6);
        flower.rotation.y += dt * rate * 0.5;
        flower.scale.setScalar(1 + Math.sin(hanaT * 2.4) * 0.05 + hanaBurst * 0.35);
        petalCloudA.rotation.y += dt * (0.35 + rate * 0.25);
        petalCloudB.rotation.y -= dt * (0.25 + rate * 0.2);
        const cs = 1 + hanaBurst * 0.9;
        petalCloudA.scale.setScalar(cs);
        petalCloudB.scale.setScalar(cs);
        // ネオン管のちらつき(applyOpacityがbaseOpacityを毎フレーム参照する)
        signMat.userData.baseOpacity = Math.random() < 0.05 ? 0.4 : 0.9 + Math.sin(hanaT * 30) * 0.04;
      },
      onGrab() { hanaBurst = 1; },   // 掴むと花びらが舞い散る
    });
  }

  return shapes;
}

// ---------- ホログラムオブジェクト ----------
class HoloObject {
  constructor() {
    this.group = new THREE.Group();
    this.opacity = 0;
    this.pos = new THREE.Vector3();
    this.vel = new THREE.Vector3();
    this.prevTarget = new THREE.Vector3();
    this.owner = -1;        // 担当する手のindex / -1: なし / -2: 両手スケール中
    this.free = false;      // 投げられて飛行中か
    this.grabbed = false;
    this.pulse = 0;
    this.userScale = 1;     // 両手ピンチで変わる倍率
    this.lastSize = 0.3;
    this.mats = [];

    this.shapes = buildShapes(this.mats);
    for (const s of this.shapes) { s.grp.visible = false; this.group.add(s.grp); }
    this.shapeIndex = 0;
    this.shapes[0].grp.visible = true;

    this.glowMat = new THREE.SpriteMaterial({
      map: glowTex, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    this.glow = new THREE.Sprite(this.glowMat);
    this.glow.scale.setScalar(3.2);

    // 周回リング(パーティクル)
    const N = 64;
    const ringPos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      ringPos[i * 3] = Math.cos(a) * 1.1;
      ringPos[i * 3 + 2] = Math.sin(a) * 1.1;
    }
    const ringGeo = new THREE.BufferGeometry();
    ringGeo.setAttribute("position", new THREE.BufferAttribute(ringPos, 3));
    this.ringMat = new THREE.PointsMaterial({
      color: HOLO, size: 0.045, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    });
    this.ringMat.userData.baseOpacity = 0.8;
    this.mats.push(this.ringMat);
    this.ring = new THREE.Points(ringGeo, this.ringMat);

    this.group.add(this.glow, this.ring);
    this.group.visible = false;
    scene.add(this.group);
  }

  setShape(i) {
    this.shapes[this.shapeIndex].grp.visible = false;
    this.shapeIndex = i;
    const sh = this.shapes[i];
    sh.grp.visible = true;
    sh.onGrab?.();
    this.ring.visible = sh.name === "CUBE" || sh.name === "SPHERE";
    this.glowMat.color.set(sh.glowColor ?? 0xffffff);
    this.glow.scale.setScalar(sh.glowScale ?? 3.2);
    this.pulse = 1;
  }

  // target: ワールド座標 / size: 手の大きさ由来の基準サイズ / grabbed: つまみ中か
  show(target, size, grabbed, dt, t) {
    if (this.opacity === 0) sfx.appear();  // 出現の瞬間
    if (grabbed && !this.grabbed) {        // 掴んだ瞬間
      this.pulse = 1;
      this.vel.set(0, 0, 0);
      this.prevTarget.copy(target);
      this.shapes[this.shapeIndex].onGrab?.();
      sfx.grab();
    }
    if (grabbed) {                         // 投げ用の速度トラッキング
      const inst = target.clone().sub(this.prevTarget).divideScalar(Math.max(dt, 1e-3));
      this.vel.lerp(inst, 0.35);
    }
    this.prevTarget.copy(target);
    this.grabbed = grabbed;
    this.free = false;
    this.opacity = Math.min(1, this.opacity + dt * 4);
    this.lastSize = size * this.userScale;

    const bob = grabbed ? 0 : Math.sin(t * 2.2) * this.lastSize * 0.12;
    this.pos.lerp(new THREE.Vector3(target.x, target.y + bob, target.z), grabbed ? 0.5 : 0.35);
    this.group.position.copy(this.pos);

    this.pulse = Math.max(0, this.pulse - dt * 3);
    const s = this.lastSize * (1 + this.pulse * 0.45) * (grabbed ? 0.85 : 1);
    this.group.scale.setScalar(THREE.MathUtils.lerp(this.group.scale.x || s, s, 0.3));

    this.shapes[this.shapeIndex].spin(dt, grabbed ? 4.0 : 0.8);
    this.ring.rotation.y += dt * 1.6;
    this.ring.rotation.x = Math.sin(t * 0.8) * 0.35;

    this.applyOpacity();
    this.group.visible = true;
  }

  // 投げられて飛行中: 慣性 + 減衰 + 画面端で跳ね返り
  updateFree(dt, t) {
    this.grabbed = false;
    this.opacity = Math.min(1, this.opacity + dt * 4);

    this.pos.addScaledVector(this.vel, dt);
    this.vel.multiplyScalar(Math.exp(-1.1 * dt));
    if (this.vel.length() < 0.05) this.vel.set(0, 0, 0);
    this.pos.z += -this.pos.z * (1 - Math.exp(-1.5 * dt));   // 奥行きは基準面へゆっくり戻る

    // このオブジェクトの深さでの画面端を計算して跳ね返す
    const dist = camera.position.z - this.pos.z;
    const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist;
    const halfH = h / 2, halfW = (h * (innerWidth / innerHeight)) / 2;
    const r = this.lastSize * 0.6;
    let impact = 0;
    if (this.pos.x > halfW - r)  { impact = Math.abs(this.vel.x); this.pos.x = halfW - r;  this.vel.x = -Math.abs(this.vel.x) * 0.75; }
    if (this.pos.x < -halfW + r) { impact = Math.abs(this.vel.x); this.pos.x = -halfW + r; this.vel.x = Math.abs(this.vel.x) * 0.75; }
    if (this.pos.y > halfH - r)  { impact = Math.max(impact, Math.abs(this.vel.y)); this.pos.y = halfH - r;  this.vel.y = -Math.abs(this.vel.y) * 0.75; }
    if (this.pos.y < -halfH + r) { impact = Math.max(impact, Math.abs(this.vel.y)); this.pos.y = -halfH + r; this.vel.y = Math.abs(this.vel.y) * 0.75; }
    if (impact > 0.35) sfx.bounce(impact);

    this.group.position.set(this.pos.x, this.pos.y + Math.sin(t * 2) * this.lastSize * 0.08, this.pos.z);

    this.pulse = Math.max(0, this.pulse - dt * 3);
    this.group.scale.setScalar(THREE.MathUtils.lerp(this.group.scale.x || this.lastSize, this.lastSize, 0.3));

    const speed = this.vel.length();
    this.shapes[this.shapeIndex].spin(dt, 0.8 + speed * 1.2);
    this.ring.rotation.y += dt * (1.6 + speed);

    this.applyOpacity();
    this.group.visible = true;
  }

  hide(dt) {
    this.grabbed = false;
    this.opacity = Math.max(0, this.opacity - dt * 3);
    if (this.opacity <= 0) { this.group.visible = false; return; }
    this.applyOpacity();
  }

  applyOpacity() {
    const o = this.opacity;
    for (const m of this.mats) m.opacity = m.userData.baseOpacity * o;
    this.glowMat.opacity = (0.7 + this.pulse * 0.5) * o;
  }
}

const shootingStars = [];
let nextShoot = 3;
function spawnShootingStar() {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const line = new THREE.Line(geo, mat);
  const dirX = (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random());
  shootingStars.push({
    line, geo, mat,
    pos: new THREE.Vector3((Math.random() - 0.5) * 6, 1.2 + Math.random() * 1.5, -1.5),
    vel: new THREE.Vector3(dirX, -(0.8 + Math.random() * 0.8), 0).multiplyScalar(1.8),
    life: 1.2,
  });
  scene.add(line);
}
function updateShootingStars(dt) {
  nextShoot -= dt;
  if (nextShoot <= 0) { spawnShootingStar(); nextShoot = 4 + Math.random() * 6; }
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.life -= dt;
    if (s.life <= 0) {
      scene.remove(s.line);
      s.geo.dispose();
      s.mat.dispose();
      shootingStars.splice(i, 1);
      continue;
    }
    s.pos.addScaledVector(s.vel, dt);
    const tail = s.pos.clone().addScaledVector(s.vel, -0.12);
    const a = s.geo.attributes.position.array;
    a[0] = s.pos.x; a[1] = s.pos.y; a[2] = s.pos.z;
    a[3] = tail.x;  a[4] = tail.y;  a[5] = tail.z;
    s.geo.attributes.position.needsUpdate = true;
    s.mat.opacity = Math.min(1, s.life * 1.5);
  }
}

// object-fit: cover + 左右反転を考慮して、正規化ランドマーク→スクリーンpx
function lmToScreen(lm) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  return { x: innerWidth - (ox + lm.x * dw), y: oy + lm.y * dh };  // xはミラー反転
}

// 手ごとの平滑化・ピンチヒステリシス・奥行き基準の状態
const handSlots = [{}, {}];
function resetSlot(s) { s.lms = null; s.pinch = false; s.sizeW = 0; s.ref = 0; }
handSlots.forEach(resetSlot);

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (landmarker && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    results = landmarker.detectForVideo(video, performance.now());
  }

  // 星空: ゆっくり回転 + 瞬き + 流れ星
  sky.rotation.z += dt * 0.012;
  for (const s of starLayers) s.mat.opacity = 0.55 + 0.35 * Math.sin(t * s.speed + s.phase);
  updateShootingStars(dt);

  hudCtx.clearRect(0, 0, innerWidth, innerHeight);
  const wpp = worldPerPixel();

  // 手ごとの情報を集める
  const handData = [];
  const rawHands = results?.landmarks ?? [];
  for (let i = 0; i < Math.min(rawHands.length, 2); i++) {
    const slot = handSlots[i];
    const raw = rawHands[i];
    // ランドマーク平滑化: 速く動くほど追従、ゆっくりだとブレ除去を優先
    if (!slot.lms) slot.lms = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    else {
      const v = Math.hypot(raw[9].x - slot.lms[9].x, raw[9].y - slot.lms[9].y) / Math.max(dt, 1e-3);
      const alpha = THREE.MathUtils.clamp(0.15 + v * 2.5, 0.15, 0.9);
      for (let j = 0; j < raw.length; j++) {
        slot.lms[j].x += (raw[j].x - slot.lms[j].x) * alpha;
        slot.lms[j].y += (raw[j].y - slot.lms[j].y) * alpha;
        slot.lms[j].z += (raw[j].z - slot.lms[j].z) * alpha;
      }
    }
    const lms = slot.lms;
    const palmIdx = [0, 5, 9, 13, 17];
    let px = 0, py = 0;
    for (const j of palmIdx) { const p = lmToScreen(lms[j]); px += p.x; py += p.y; }
    px /= palmIdx.length; py /= palmIdx.length;
    const wrist = lmToScreen(lms[0]), midMcp = lmToScreen(lms[9]);
    const palmSize = Math.hypot(midMcp.x - wrist.x, midMcp.y - wrist.y);
    const thumb = lmToScreen(lms[4]), index = lmToScreen(lms[8]);
    const pinchDist = Math.hypot(index.x - thumb.x, index.y - thumb.y);
    // ヒステリシス: 掴むときは深く(0.40)、離すのは浅く(0.55)でチャタリング防止
    const pinch = pinchDist < palmSize * (slot.pinch ? 0.55 : 0.40);
    slot.pinch = pinch;
    const pinchS = { x: (thumb.x + index.x) / 2, y: (thumb.y + index.y) / 2 };
    // 奥行き: 手のひらサイズの変化から推定(基準値はゆっくり自動キャリブレーション)
    const sizeW = palmSize * wpp * 1.1;
    slot.sizeW = slot.sizeW ? slot.sizeW + (sizeW - slot.sizeW) * 0.15 : sizeW;
    slot.ref = slot.ref ? slot.ref + (slot.sizeW - slot.ref) * 0.0015 : slot.sizeW;
    const zOff = THREE.MathUtils.clamp((slot.sizeW - slot.ref) * 3.0, -0.55, 0.85);
    handData.push({
      lms, pinch, pinchS,
      palmW: screenToWorld(px, py, zOff),
      pinchW: screenToWorld(pinchS.x, pinchS.y, zOff),
      hoverW: screenToWorld(px, py - palmSize * 1.6, zOff),
      sizeW: slot.sizeW,
    });
    if (showSkeleton) drawSkeleton(lms, pinch);
  }
  for (let i = rawHands.length; i < 2; i++) resetSlot(handSlots[i]);   // 消えた手はリセット

  const bothPinch = handData.length === 2 && handData[0].pinch && handData[1].pinch;

  // ---- 両手ピンチ: 拡大縮小モード ----
  if (bothPinch && !scaleMode) {
    let obj = objs.find(o => !o.free && o.owner >= 0) ?? objs.find(o => !o.free) ?? objs[0];
    obj.free = false;
    scaleMode = { obj, d0: handData[0].pinchW.distanceTo(handData[1].pinchW), s0: obj.userScale };
    obj.owner = -2;
  }
  if (scaleMode && !bothPinch) {
    scaleMode.obj.owner = -1;   // 残った手が次フレームで引き継ぐ
    scaleMode = null;
  }

  if (scaleMode) {
    const [h0, h1] = handData;
    const d = h0.pinchW.distanceTo(h1.pinchW);
    const obj = scaleMode.obj;
    obj.userScale = THREE.MathUtils.clamp(scaleMode.s0 * (d / scaleMode.d0), 0.35, 4);
    const mid = h0.pinchW.clone().add(h1.pinchW).multiplyScalar(0.5);
    obj.show(mid, (h0.sizeW + h1.sizeW) / 2, true, dt, t);
    drawScaleHud(h0.pinchS, h1.pinchS, obj.userScale);

    for (const o of objs) {
      if (o === obj) continue;
      if (o.free) o.updateFree(dt, t);
      else { o.owner = -1; o.hide(dt); }
    }
  } else {
    // 消えた手の担当を解除
    for (const o of objs) {
      if (!o.free && o.owner >= handData.length) o.owner = -1;
    }

    // 飛行中オブジェクト: 慣性移動 + 手が近づいたらキャッチ
    for (const o of objs) {
      if (!o.free) continue;
      o.updateFree(dt, t);
      for (let h = 0; h < handData.length; h++) {
        if (objs.some(x => x.owner === h && !x.free)) continue;  // この手はもう持っている
        const hand = handData[h];
        const ref = hand.pinch ? hand.pinchW : hand.palmW;
        const capR = Math.max(o.lastSize * 1.3, hand.sizeW * 1.4);
        // 奥行きズレで取り逃さないようキャッチ判定はxy距離ベース
        if (Math.hypot(ref.x - o.pos.x, ref.y - o.pos.y) < capR && Math.abs(ref.z - o.pos.z) < 0.7) {
          o.free = false;
          o.owner = h;
          o.vel.set(0, 0, 0);
          o.pulse = 1;
          sfx.catchChime();
          break;
        }
      }
    }

    // 手ごとにオブジェクトを割り当てて更新
    for (let h = 0; h < handData.length; h++) {
      const hand = handData[h];
      let obj = objs.find(o => o.owner === h && !o.free);
      if (!obj) {
        obj = objs.find(o => o.owner === -1 && !o.free);
        if (obj) obj.owner = h;
      }
      if (!obj) continue;   // 両方とも飛行中

      const grabbed = hand.pinch;
      if (obj.grabbed && !grabbed && obj.vel.length() > THROW_SPEED) {
        // ピンチを勢いよく離した → 投げる
        obj.free = true;
        obj.owner = -1;
        obj.grabbed = false;
        obj.vel.clampLength(0, MAX_SPEED);
        sfx.release(obj.vel.length());
        obj.updateFree(dt, t);
      } else {
        obj.show(grabbed ? hand.pinchW : hand.hoverW, hand.sizeW, grabbed, dt, t);
      }
    }

    // 担当なし & 飛行中でもない → フェードアウト
    for (const o of objs) {
      if (!o.free && o.owner === -1) o.hide(dt);
    }
  }

  renderer.render(scene, camera);
}

// ---------- 起動 ----------
(async () => {
  try {
    statusEl.textContent = "CAMERA INITIALIZING…";
    await startCamera();
    statusEl.textContent = "LOADING HAND TRACKER…";
    await initHands();
    toast("ONLINE — SHOW YOUR HAND ✋", 4000);
    tick();
  } catch (err) {
    statusEl.textContent = "ERROR: " + err.message;
    statusEl.style.color = "#ff6666";
    console.error(err);
  }
})();
</script>
</body>
